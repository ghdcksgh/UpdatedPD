buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.2'
    }
}

allprojects {

    ext {
        appName = 'UpdatedPD'
        appPackageName = 'com.updatedpd.updatedpixeldungeon'

        //Full releases gets +2 on version code, needed for an F-Droid quirk
        appVersionCode = 922
        appVersionName = '4.0.2'
        //for arranged version code and version name
        appVersionCode += 62
        appVersionName += '_based_3.40.0_FINAL'

        appJavaCompatibility = JavaVersion.VERSION_11

        appAndroidCompileSDK = 36   //Android 15
        appAndroidMinSDK = 24       //Android 5.0
        appAndroidTargetSDK = 36    //Android 15

        gdxVersion = '1.14.0'
        gdxControllersVersion = '2.2.4'
        robovmVersion = '2.3.24'
    }
    version = appVersionName

    repositories {
        google()
        mavenCentral()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }
}